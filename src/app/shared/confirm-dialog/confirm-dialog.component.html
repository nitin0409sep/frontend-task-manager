<h2 mat-dialog-title>{{ data.title }}</h2>
<div mat-dialog-content class="min-w-[320px] max-w-md text-slate-600">
  {{ data.message }}
</div>
<div mat-dialog-actions align="end" class="!px-6 !pb-5">
  <button mat-button type="button" (click)="close(false)" [disabled]="loading">{{ data.cancelText || 'Cancel' }}</button>
  <button mat-raised-button color="warn" type="button" class="loading-button" (click)="confirm()" [disabled]="loading">
    <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
    <span>{{ data.confirmText || 'Confirm' }}</span>
  </button>
</div>
